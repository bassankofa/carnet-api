services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carnet
      POSTGRES_USER: carnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Pas de section "ports" : la base n'est jamais exposée sur Internet

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/carnet
      DB_USER: carnet
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
